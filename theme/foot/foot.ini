# Written by theme/make from theme/palette; edit those, not this.
[main]
font=Geist Mono:pixelsize=15
pad=8x8
initial-window-size-pixels=720x540
initial-color-theme=light
resize-by-cells=no
# Selecting text copies it to the clipboard too, so Ctrl+V pastes it
# anywhere (Ctrl+C stays the interrupt)
selection-target=both

[bell]
urgent=yes
notify=no
visual=no

[scrollback]
lines=10000

[cursor]
style=block
blink=no

[mouse]
hide-when-typing=yes

[csd]
preferred=server

[colors-light]
background=1a1a17
foreground=e8ebe6
selection-background=99edff
selection-foreground=000000
urls=8fb4ff
regular0=2e2e28
regular1=e0243c
regular2=4f7a00
regular3=ffd600
regular4=8fb4ff
regular5=ab77ff
regular6=99edff
regular7=c9d3cc
bright0=9a9a8f
bright1=ff7a1a
bright2=adff00
bright3=ffd600
bright4=8fb4ff
bright5=ffc4d8
bright6=c5e9ff
bright7=ffffff
