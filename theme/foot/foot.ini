# Written by theme/make from theme/palette; edit those, not this.
[main]
font=Geist Mono:pixelsize=15
pad=8x8
initial-window-size-pixels=720x540
initial-color-theme=light
resize-by-cells=no

[bell]
urgent=yes
notify=no
visual=no

[scrollback]
lines=10000

[cursor]
style=block
blink=no

[mouse]
hide-when-typing=yes

[csd]
preferred=server

