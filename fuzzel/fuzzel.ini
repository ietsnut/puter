# The launcher, opened by the search square or Super+Space: a white panel on
# the left edge, standing on the search square (y-margin is above the bar), rows one module tall, black,
# gray and white like everything else (quickshell/Theme.qml).
[main]
font=Geist:pixelsize=15
use-bold=no
dpi-aware=no
prompt=""
placeholder=Search
icons-enabled=no
anchor=bottom-left
x-margin=0
y-margin=30
layer=overlay
lines=10
minimal-lines=yes
# Each character of width is 9px of Geist at 15px; 52 of them and 6px of
# padding each side make 480px, sixteen modules. fuzzel insets the highlight
# 2px less than the text, so with the text 6px in, the highlight sits 4px in.
width=52
line-height=30px
horizontal-pad=6
vertical-pad=0
inner-pad=0
exit-on-keyboard-focus-loss=yes

[colors]
background=ffffffff
text=000000ff
prompt=808080ff
placeholder=808080ff
input=000000ff
match=000000ff
selection=808080ff
selection-text=000000ff
selection-match=000000ff
counter=808080ff
border=00000000

[border]
width=0
radius=0
selection-radius=0
