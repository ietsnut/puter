# Builds puter's USB installer (iso/build), installs it on an empty disk in
# QEMU and starts what it installed (screenshot and logs kept for a day as
# the run's artifact), and only then publishes it to GitHub's container
# registry as ghcr.io/ietsnut/puter-iso:latest, deleting the one before.
# Download it with iso/download. Runs weekly, on pushes to main touching
# iso/, and by hand; never for pull requests.
name: iso

on:
  push:
    branches: [main]
    paths: [iso/**, .github/workflows/iso.yml]
  schedule:
    - cron: "37 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: iso

jobs:
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      # The runner's own toolchains make room for the build, which goes on
      # its second disk (/mnt).
      - name: Room
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          sudo mkdir -p /mnt/iso && sudo chown "$USER" /mnt/iso
          df -h / /mnt

      - uses: actions/checkout@v4

      - name: Build
        run: |
          docker run --rm --privileged -v "$PWD:/puter:ro" -v /mnt/iso:/work archlinux:latest \
            /puter/iso/build /work/build /work/out
          sudo rm -rf /mnt/iso/build

      - name: Install it, in QEMU
        run: |
          sudo apt-get update -q && sudo apt-get install -yq qemu-system-x86 ovmf qemu-utils libarchive-tools socat
          sudo chmod 666 /dev/kvm
          cd /mnt/iso
          bsdtar -xf out/puter.iso arch/boot/x86_64/vmlinuz-linux arch/boot/x86_64/initramfs-linux.img
          cp /usr/share/OVMF/OVMF_VARS_4M.fd vars.fd
          qemu-img create -f qcow2 disk.qcow2 40G
          # The stick's own kernel, started directly, so the command line
          # can say which disk: the installer then asks nothing and powers
          # off when done.
          timeout 60m qemu-system-x86_64 -enable-kvm -machine q35 -cpu host -smp 4 -m 6G \
            -drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd \
            -drive if=pflash,format=raw,file=vars.fd \
            -drive file=out/puter.iso,media=cdrom,readonly=on \
            -drive file=disk.qcow2,if=virtio \
            -kernel arch/boot/x86_64/vmlinuz-linux -initrd arch/boot/x86_64/initramfs-linux.img \
            -append "archisobasedir=arch archisodevice=/dev/sr0 puter.disk=/dev/vda console=ttyS0" \
            -display none -serial file:install.log -no-reboot || true
          tail -40 install.log
          grep -q '::installed' install.log

      - name: Start what it installed
        run: |
          cd /mnt/iso
          qemu-system-x86_64 -enable-kvm -machine q35 -cpu host -smp 4 -m 6G \
            -drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd \
            -drive if=pflash,format=raw,file=vars.fd \
            -drive file=disk.qcow2,if=virtio -device virtio-vga \
            -display none -serial file:boot.log -monitor unix:monitor.sock,server,nowait &
          sleep 150
          echo "screendump /mnt/iso/desktop.png -f png" | socat - UNIX-CONNECT:monitor.sock
          sleep 2
          echo quit | socat - UNIX-CONNECT:monitor.sock || true
          ls -l desktop.png

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: test
          path: |
            /mnt/iso/install.log
            /mnt/iso/boot.log
            /mnt/iso/desktop.png
          retention-days: 1

      - uses: oras-project/setup-oras@v1

      - name: Publish
        run: |
          cd /mnt/iso/out
          echo "${{ github.token }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          oras push ghcr.io/ietsnut/puter-iso:latest \
            --artifact-type application/vnd.puter.iso \
            --annotation org.opencontainers.image.source=https://github.com/ietsnut/puter \
            --annotation org.opencontainers.image.revision=${{ github.sha }} \
            puter.iso:application/vnd.efi.iso

      # Only the newest is kept.
      - uses: actions/delete-package-versions@v5
        with:
          package-name: puter-iso
          package-type: container
          min-versions-to-keep: 1
