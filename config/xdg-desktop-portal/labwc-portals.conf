# Which portal answers which request, for apps that ask the desktop rather
# than drawing their own dialogs (Electron, GTK 4, Flatpaks, and the Qt apps
# through qt6ct). Read for XDG_CURRENT_DESKTOP=labwc, which labwc sets.
#
# Files: LXQt's portal, whose dialog is libfm-qt's (PCManFM-Qt's own), so it
# takes puter's Qt style and stylesheet like every other window; it's the
# default for anything else too. Screenshots and screen sharing: wlroots'.
# No GTK portal: it only answered for desktop settings, which nothing in puter
# needs, and as that's asked for at login it kept 16 MB in use all the time.
[preferred]
default=lxqt
org.freedesktop.impl.portal.FileChooser=lxqt
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.ScreenCast=wlr
