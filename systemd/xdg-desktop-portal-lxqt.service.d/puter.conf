# The file dialog's portal (xdg-desktop-portal/) is started by systemd, and its
# service sets QT_QPA_PLATFORMTHEME=lxqt, LXQt's own theme, which puter doesn't
# install: it fell back to plain Fusion. qt6ct gives it puter's Qt style and
# stylesheet, like every other Qt window.
[Service]
Environment=QT_QPA_PLATFORMTHEME=qt6ct
